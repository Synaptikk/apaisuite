<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>APAISuite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Applies the saved theme before any stylesheet loads, avoiding a flash of
       light theme for dark-preference users. External, not inline: MV3's
       default CSP is script-src 'self', so the inline version this replaces
       was blocked on every load and never ran. -->
  <script src="theme_boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>

<div class="shell">
  <header class="shell-header">
    <a href="#/home" class="shell-header-brand" data-route="#/home">
      <svg viewBox="-16 -16 32 32" aria-hidden="true">
        <!-- APAISuite badge: shield + star, blue. Matches assets/logos/suite.svg. -->
        <path d="M0,-12 L10,-8 L10,4 C10,9 5,13 0,14 C-5,13 -10,9 -10,4 L-10,-8 Z"
              fill="none" stroke="#0071CE" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M0,-3.5 L0.79,-1.08 L3.33,-1.08 L1.27,0.41 L2.06,2.83 L0,1.34 L-2.06,2.83 L-1.27,0.41 L-3.33,-1.08 L-0.79,-1.08 Z"
              fill="#0071CE"/>
      </svg>
      <span>APAISuite</span>
    </a>
    <span class="shell-header-spacer"></span>
    <div class="shell-header-actions">
      <span class="pill" id="suite-version" title="APAISuite version">…</span>
    </div>
  </header>

  <!-- Update-available banner. Spans the full grid width below the header,
       hidden until shared/updater_ui.js detects a new published version. -->
  <div id="suite-update-banner" class="shell-update-banner" hidden></div>

  <nav class="shell-sidebar" aria-label="Modules">
    <div class="shell-nav" id="shell-nav">
      <!-- Populated by app.js from the module registry -->
    </div>
    <div class="shell-sidebar-footer">
      <a href="#/settings" class="shell-nav-item" data-route="#/settings">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="10" cy="10" r="2.5"></circle>
          <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"></path>
        </svg>
        Settings
      </a>
      <a href="#/docs" class="shell-nav-item" data-route="#/docs">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M4 3h9l3 3v11H4z"></path>
          <path d="M13 3v3h3"></path>
          <path d="M7 9h6M7 12h6M7 15h4"></path>
        </svg>
        Docs
      </a>
    </div>
  </nav>

  <section class="shell-viewport">
    <main id="shell-main">
      <!-- Rendered by app.js per route -->
    </main>
  </section>
  <footer class="shell-footer">
    © 2026 Shane Smith™ · APAISuite
  </footer>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
