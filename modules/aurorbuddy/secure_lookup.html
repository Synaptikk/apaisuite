<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Secure lookup</title>
  <link rel="icon" type="image/x-icon" href="assets/secure.ico" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1a2233;
      background: #f7f8fb;
      min-height: 100vh;
    }
    header.bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid #e3e7ef;
      position: sticky; top: 0; z-index: 2;
    }
    header.bar img.logo { width: 22px; height: 22px; }
    header.bar .who { flex: 1; min-width: 0; }
    header.bar .name { font-weight: 600; font-size: 14px; }
    header.bar .id { color: #6b7588; font-size: 12px; }
    header.bar .controls { display: flex; gap: 6px; align-items: center; }
    header.bar input[type="text"] {
      padding: 4px 6px; border: 1px solid #c9d1de; border-radius: 6px; font: inherit;
    }
    header.bar input#name-input  { width: 160px; }
    header.bar input#store-input { width: 70px; }
    header.bar button {
      padding: 5px 12px; border-radius: 6px; border: 1px solid #2456a8; background: #2456a8; color: #fff;
      font: 600 12px/1 system-ui; cursor: pointer;
    }
    header.bar button:disabled { opacity: .55; cursor: default; }
    main { padding: 12px 14px 24px; }
    .status { padding: 8px 0; color: #6b7588; }
    .status.error { color: #b3261e; }
    .card {
      background: #fff; border: 1px solid #e3e7ef; border-radius: 8px; margin: 10px 0; overflow: hidden;
    }
    .card .ch {
      display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px;
      background: #f0f3f9; border-bottom: 1px solid #e3e7ef; font-size: 12px;
    }
    .card .ch .holder { font-weight: 600; }
    .card .ch .masked { color: #6b7588; font-variant-numeric: tabular-nums; }
    table.txns { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.txns th, table.txns td { padding: 6px 10px; border-bottom: 1px solid #eef0f4; text-align: left; vertical-align: top; }
    table.txns th { background: #fafbfd; font-weight: 600; color: #4a546b; }
    table.txns tr.at-home td { background: #fffbe6; }
    table.txns td.amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    table.txns td.dt { white-space: nowrap; color: #4a546b; }
    table.txns td a { color: #2456a8; text-decoration: none; }
    table.txns td a:hover { text-decoration: underline; }
    .empty { padding: 16px; color: #6b7588; text-align: center; font-style: italic; }
    .pill {
      display: inline-block; padding: 1px 7px; border-radius: 999px;
      font-size: 11px; font-weight: 600; line-height: 1.5; margin-left: 6px;
    }
    .pill.home { background: #fff3c4; color: #6b5502; }
  </style>
</head>
<body>
  <header class="bar">
    <img class="logo" src="assets/secure.ico" alt="Secure" />
    <div class="who">
      <div class="name" id="who-name">Loading…</div>
      <div class="id"   id="who-id"></div>
    </div>
    <div class="controls">
      <label>Name <input type="text" id="name-input" autocomplete="off" placeholder="First Last" /></label>
      <label>Store <input type="text" id="store-input" maxlength="6" inputmode="numeric" /></label>
      <button id="search-btn" type="button">Search</button>
    </div>
  </header>
  <main>
    <div id="status" class="status">Initialising…</div>
    <div id="results"></div>
  </main>
  <script type="module" src="secure_lookup.js"></script>
</body>
</html>
