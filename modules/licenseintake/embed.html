<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>License Intake</title>
  <!-- Suite design tokens + components, so the licenseintake UI renders

  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/components.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--apai-bg, #f2f2f2); color: var(--apai-fg, #1f2024); height: 100%; overflow-y: auto; }
