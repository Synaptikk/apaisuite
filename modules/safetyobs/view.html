<div class="so">
  <header class="so-header">
    <div>
      <h1>Safety Observations</h1>
      <p class="so-sub">Type what you saw. The tool picks the answers for the Safety Observation Survey (the QR poster form), shows them to you, and submits it under your Microsoft account when you confirm.</p>
    </div>
  </header>

  <section class="so-card">
    <form id="safetyobs-parse-form" class="so-entry">
      <textarea id="safetyobs-sentence" class="input" rows="2" placeholder="Shane was observed in Fresh cleaning a spill with a mop"></textarea>
      <button id="safetyobs-parse" class="btn btn-primary" type="submit">Fill out form</button>
    </form>
    <div id="safetyobs-parse-msg" class="so-status" hidden></div>

    <div id="safetyobs-review" class="so-review" hidden>
      <div class="so-grid" id="safetyobs-fields"></div>
      <p id="safetyobs-note" class="so-muted"></p>
      <div class="so-actions">
        <button id="safetyobs-submit" class="btn btn-primary">Submit observation</button>
        <button id="safetyobs-dry" class="btn btn-secondary btn-sm" title="Fill the real form in a background tab, then close it without submitting">Test fill (no submit)</button>
        <button id="safetyobs-cancel" class="btn btn-secondary btn-sm">Cancel</button>
      </div>
    </div>
  </section>

  <section class="so-card">
    <div class="so-row">
      <h2>Coach check <small id="safetyobs-next" class="so-muted"></small></h2>
      <div class="so-actions">
        <button id="safetyobs-preview" class="btn btn-secondary btn-sm">Check now</button>
        <button id="safetyobs-post" class="btn btn-secondary btn-sm">Post now</button>
      </div>
    </div>
    <div id="safetyobs-check" class="so-check"></div>
  </section>

  <section class="so-card">
    <div class="so-row">
      <h2>Behind since <input id="safetyobs-from" class="input" type="date"> <small class="so-muted">2 per scheduled day</small></h2>
      <button id="safetyobs-ledger-run" class="btn btn-secondary btn-sm">Refresh</button>
    </div>
    <div id="safetyobs-ledger" class="so-table-wrap"></div>
  </section>

  <section class="so-card">
    <h2>Submitted from here</h2>
    <div id="safetyobs-history" class="so-table-wrap"></div>
  </section>

  <details class="so-card">
    <summary>Settings</summary>
    <form id="safetyobs-settings" class="so-settings">
      <label>Store <input id="safetyobs-store" class="input" inputmode="numeric"></label>
      <label>Your role on the form <select id="safetyobs-role" class="input"></select></label>
      <label>Workvivo chat <input id="safetyobs-channel" class="input"></label>
      <label>Check time <input id="safetyobs-checkat" class="input" type="time"></label>
      <label class="so-inline"><input id="safetyobs-enabled" type="checkbox"> Post the daily coach check</label>
      <label class="so-inline"><input id="safetyobs-ai" type="checkbox"> Use the AI gateway to pick answers <small id="safetyobs-ai-state" class="so-muted"></small></label>
      <button class="btn btn-primary btn-sm" type="submit">Save</button>
    </form>
  </details>
</div>
